# Genera y sube las cuadrículas de unos grupos de ciudades.json. Lo llama
# datos-osm.yml dos veces: todos los grupos y, después, solo los que han
# fallado (Geofabrik a veces rechaza las conexiones de una máquina de GitHub
# durante mucho rato; en otra máquina suele ir a la primera).
name: Generar grupos

on:
  workflow_call:
    inputs:
      grupos:
        description: "Lista JSON de grupos"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5 # sin agobiar a Geofabrik
      matrix:
        grupo: ${{ fromJson(inputs.grupos) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pyosmium y osmium-tool
        run: |
          pip install -r tool/datos/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Descargar y recortar (Geofabrik)
        run: python tool/datos/preparar_grupo.py tool/datos/ciudades.json "${{ matrix.grupo }}" trabajo

      - name: Generar cuadrículas
        run: |
          python tool/datos/generar_teselas.py trabajo/grupo.osm.pbf salida \
            --ciudades tool/datos/ciudades.json --grupo "${{ matrix.grupo }}" \
            --fecha-osm "$(cat trabajo/fecha_osm.txt)"

      - name: Subir cuadrículas a R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 no acepta las sumas de comprobación nuevas por defecto del AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          # Solo las cuadrículas que han cambiado desde el manifiesto publicado
          # (leído de R2, no de la caché de Cloudflare): cada subida es una
          # escritura de clase A. Si no se puede leer, se suben todas.
          aws s3 cp "s3://$BUCKET/osm/v1/manifest.json" anterior.json \
            --endpoint-url "$ENDPOINT" --only-show-errors || rm -f anterior.json
          python3 tool/datos/cambiadas.py salida/osm/v1 anterior.json subir/osm/v1
          # cp --recursive y no sync: sync lista todo osm/v1 en R2 (más de
          # 100 páginas de listado, también de clase A) para comparar.
          if [ -n "$(ls -A subir/osm/v1)" ]; then
            aws s3 cp subir/osm/v1 "s3://$BUCKET/osm/v1" --recursive --endpoint-url "$ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=86400" --no-progress --only-show-errors
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: manifiesto-${{ matrix.grupo }}
          path: salida/osm/v1/manifest.json
          retention-days: 7
