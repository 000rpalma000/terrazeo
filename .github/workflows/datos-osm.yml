# Regenera los datos propios de OpenStreetMap de las ciudades de
# tool/datos/ciudades.json y los sube a R2. Ver tool/datos/README.md.
#
# Una tarea por grupo de ciudades (las que comparten extracto de Geofabrik),
# en paralelo. Cada una sube sus cuadrículas; al final se juntan los
# manifiestos y se sube manifest.json, siempre lo último.
name: Datos OSM

on:
  schedule:
    - cron: "0 4 2 * *" # día 2 de cada mes, 04:00 UTC
  workflow_dispatch:
    inputs:
      grupos:
        description: "Solo estos grupos (separados por espacios; vacío = todos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      grupos: ${{ steps.grupos.outputs.grupos }}
    steps:
      - uses: actions/checkout@v4
      - id: grupos
        env:
          SOLO: ${{ github.event.inputs.grupos }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          ciudades = json.load(open("tool/datos/ciudades.json"))
          grupos = sorted({c["grupo"] for c in ciudades})
          solo = os.environ.get("SOLO", "").split()
          if solo:
              grupos = [g for g in grupos if g in solo]
          print("grupos=" + json.dumps(grupos))
          EOF

  generar:
    needs: plan
    if: ${{ needs.plan.outputs.grupos != '[]' }}
    uses: ./.github/workflows/generar-grupos.yml
    with:
      grupos: ${{ needs.plan.outputs.grupos }}
    secrets: inherit

  # Los grupos sin manifiesto parcial han fallado (casi siempre, Geofabrik
  # rechazando la descarga): se reintentan una vez, tras 10 minutos, en
  # máquinas nuevas.
  repaso:
    needs: [plan, generar]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      grupos: ${{ steps.faltan.outputs.grupos }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # si no ha salido ninguno, faltan todos
        with:
          pattern: manifiesto-*
          path: partes
      - id: faltan
        env:
          TODOS: ${{ needs.plan.outputs.grupos }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          hechos = {p.name.removeprefix("manifiesto-") for p in Path("partes").glob("manifiesto-*")}
          faltan = [g for g in json.loads(os.environ["TODOS"]) if g not in hechos]
          print("grupos=" + json.dumps(faltan))
          EOF
          cat "$GITHUB_OUTPUT"
      - name: Esperar antes de reintentar
        if: ${{ steps.faltan.outputs.grupos != '[]' }}
        run: sleep 600

  reintentar:
    needs: repaso
    if: ${{ always() && needs.repaso.result == 'success' && needs.repaso.outputs.grupos != '[]' }}
    uses: ./.github/workflows/generar-grupos.yml
    with:
      grupos: ${{ needs.repaso.outputs.grupos }}
    secrets: inherit

  manifiesto:
    needs: [plan, generar, repaso, reintentar]
    # También si algún grupo ha fallado dos veces: conserva el mes anterior.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: manifiesto-*
          path: partes

      - name: Juntar manifiestos y subirlos a R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          # El manifiesto anterior, directamente de R2: el de data.lat41lab.com
          # puede ser una copia vieja de la caché de Cloudflare (y entonces se
          # perderían las ciudades que no se generan en esta ejecución).
          # Si no se puede leer, mejor fallar que publicar uno incompleto.
          aws s3 cp "s3://$BUCKET/osm/v1/manifest.json" anterior.json \
            --endpoint-url "$ENDPOINT" --only-show-errors
          python3 tool/datos/unir_manifiestos.py tool/datos/ciudades.json partes \
            salida/manifest.json --anterior anterior.json
          # Las ciudades que de verdad tienen datos (apps y lat41lab.com).
          python3 tool/datos/generar_ciutats.py tool/datos/ciudades.json \
            salida/manifest.json salida/ciutats.json

          aws s3 cp salida/manifest.json "s3://$BUCKET/osm/v1/manifest.json" \
            --endpoint-url "$ENDPOINT" --content-type application/json \
            --cache-control "public, max-age=300"
          aws s3 cp salida/ciutats.json "s3://$BUCKET/ciutats.json" \
            --endpoint-url "$ENDPOINT" --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300"
